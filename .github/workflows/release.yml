name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Mod version (e.g. 1.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get version info
        id: versions
        run: |
          MOD_VERSION=$(grep 'mod_version=' gradle.properties | cut -d'=' -f2 | xargs)
          MC_VERSION=$(grep 'minecraft_version=' gradle.properties | cut -d'=' -f2 | xargs)
          echo "mod_version=$MOD_VERSION" >> $GITHUB_OUTPUT
          echo "minecraft_version=$MC_VERSION" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '21'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      - name: Find release JAR
        id: find-jar
        run: |
          JAR_FILE=$(find build/libs -maxdepth 1 -type f \
            -name "*.jar" \
            ! -name "*-dev*.jar" \
            ! -name "*-sources*.jar" \
            ! -name "*-javadoc*.jar" \
            | head -n 1)
          echo "jar_file=$JAR_FILE" >> $GITHUB_OUTPUT
          echo "Found JAR: $JAR_FILE"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: "GuildInviteFix ${{ inputs.version }} for Minecraft ${{ steps.versions.outputs.minecraft_version }}"
          body: |
            ## GuildInviteFix ${{ inputs.version }}

            **Minecraft:** ${{ steps.versions.outputs.minecraft_version }}
            **Mod Loader:** Fabric

            ### Installation
            1. Install Fabric Loader for Minecraft ${{ steps.versions.outputs.minecraft_version }}
            2. Download the JAR from this release
            3. Place in `.minecraft/mods/` folder
            4. Install Fabric API
          files: |
            ${{ steps.find-jar.outputs.jar_file }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
