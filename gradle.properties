# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.1.2
loader_version=0.19.5
loom_version=1.17-SNAPSHOT

# Mod Properties
mod_version=2.0.4
maven_group=com.ginv

# Dependencies
fabric_api_version=0.155.3+26.1.2

# LDLib2 (TheyCallMeAbstract/ldlib2-Architectury fork, branch 26.1)
# .41 de-bundles its Kotlin copy and declares a hard fabric.mod.json
# dependency on fabric-language-kotlin, so we must supply it ourselves
# (below) — see build.gradle.
ldlib2_version=26.1.2.41
architectury_api_version=20.0.12
yacl_version=3.9.1+26.1-fabric

# Required by ldlib2 .41 (was previously shaded inside the ldlib2 jar).
# Gradle picks this up from Fabric's maven, which Loom already registers.
fabric_language_kotlin_version=1.14.1+kotlin.2.4.20
