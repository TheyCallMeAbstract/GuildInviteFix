plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

repositories {
	// Escape hatch: build the ldlib2-Architectury fork locally and run
	// `./gradlew :fabric:publishToMavenLocal` (see README -> Building).
	mavenLocal()

	// JUnit (test source set only)
	mavenCentral()

	// LDLib2 Fabric port, fetched from the fork's public GitHub release assets.
	// Public release downloads need no credentials — no tokens, gradle
	// properties, env vars or CI secrets involved.
	ivy {
		name = 'LDLib2 GitHub Releases'
		url = 'https://github.com/TheyCallMeAbstract/ldlib2-Architectury'
		patternLayout {
			artifact('releases/download/v[revision]/[artifact]-[revision].[ext]')
		}
		metadataSources {
			artifact()
		}
	}

	// Architectury API and YACL (hard runtime dependencies of LDLib2)
	maven { url = 'https://maven.architectury.dev/' }
	maven { url = 'https://maven.isxander.dev/releases' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// LDLib2 UI framework (Fabric port by TheyCallMeAbstract)
	// Note: this Loom generation (no-remap, unobfuscated MC) has no mod*
	// configurations — plain `implementation` puts deps on the runClient
	// classpath where Loom auto-detects fabric.mod.json jars as mods.
	implementation "com.lowdragmc.lowdraglib2:ldlib2-fabric:${project.ldlib2_version}"
	// Hard runtime dependencies declared by ldlib2's fabric.mod.json
	implementation "dev.architectury:architectury-fabric:${project.architectury_api_version}"
	implementation "dev.isxander:yet-another-config-lib:${project.yacl_version}"

	// Headless JUnit for the pure logic (parse rules, queue-result contract).
	// The GUI suite lives in the uitest scenarios instead — see README.
	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
	testImplementation platform('org.junit:junit-bom:5.11.4')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
	useJUnitPlatform()
	// ThemeSheetInvariantsTest reads the generated sheets; make sure the
	// template has been expanded before the test source set runs.
	dependsOn 'generateThemeSheets'
}

// UITest harness wiring (LDLib2's scenario runner). Off unless -PldTest is
// passed, so a normal `runClient` is untouched:
//
//   ./gradlew runClient -PldTest=mod:guildinvitefix
//   ./gradlew runClient -PldTest=group:guildinvitefix -PldTestHeadless
//   ./gradlew runClient -PldTest=mod:guildinvitefix -PldTestGuiScale=3
//
// Output (report.json + PNG screenshots) lands in build/reports/lduitest.
loom {
	runs {
		client {
			if (project.hasProperty('ldTest')) {
				property 'ldlib2.uitest.run', project.property('ldTest').toString()
				property 'ldlib2.uitest.out',
						layout.buildDirectory.dir('reports/lduitest').get().asFile.absolutePath
				property 'ldlib2.uitest.guiScale',
						project.findProperty('ldTestGuiScale')?.toString() ?: '2'
				// Above the 120s per-scenario timeout so the watchdog never
				// kills a scenario mid-run during world creation.
				property 'ldlib2.uitest.watchdogSec',
						project.findProperty('ldTestWatchdog')?.toString() ?: '180'
				if (project.hasProperty('ldTestWindow')) {
					property 'ldlib2.uitest.window', project.property('ldTestWindow').toString()
				}
				if (project.hasProperty('ldTestHeadless')) {
					property 'ldlib2.uitest.headless', 'true'
				}
				if (project.hasProperty('ldTestKeepOpen')) {
					property 'ldlib2.uitest.keepOpen', 'true'
				}
			}
		}
	}
}

// LDLib2 scenario discovery in dev (supports the uitest wiring above).
// LDLib2's annotation scanner walks each mod's root paths, then falls back to
// classpath directories — but only those containing a com/lowdragmc/lowdraglib2/
// marker package, an upstream heuristic that in practice only ever matches
// LDLib2's own dev output. Loom hands our compiled classes to the JVM as
// build/classes/java/main (no marker), so the scan skips them entirely and
// `-PldTest=mod:guildinvitefix` selects nothing even though everything
// compiles. Creating the empty marker after compilation makes our class output
// dir eligible for the scan, keeping the @LDLRegisterClient annotations the
// single source of truth (release jars are scanned via their own root path, so
// production behaviour is unchanged either way).
def ldlib2ScanMarker = layout.buildDirectory.dir('classes/java/main/com/lowdragmc/lowdraglib2').get().asFile
tasks.named('classes') {
	doLast {
		ldlib2ScanMarker.mkdirs()
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

// Generated theme sheets (Stage 1). src/theme/office.lss.tmpl plus per-theme
// token tables under src/theme/tokens/ expand at build time into
// office-<id>.lss, which processResources ships inside the mod jar. LDLib2 LSS
// has no runtime var()/alias, so the palette is materialized per theme here.
// The template and token tables live outside src/main/resources, so they never
// enter the jar. Output must stay unit-free (D6): only paint/geometry-free
// declarations live in the sheet; Java owns all u() geometry.
def generatedThemeSheetsDir = layout.buildDirectory.dir('generated/themeSheets')

def generateThemeSheets = tasks.register('generateThemeSheets') {
	description = 'Expands office.lss.tmpl per theme token table into office-<id>.lss.'
	group = 'build'

	def templateFile = file('src/theme/office.lss.tmpl')
	def tokensDir = file('src/theme/tokens')
	def outputDir = generatedThemeSheetsDir

	inputs.file(templateFile).withPropertyName('template')
	inputs.dir(tokensDir).withPropertyName('tokens')
	outputs.dir(outputDir).withPropertyName('sheets')

	doLast {
		def template = templateFile.getText('UTF-8')
		def outLssDir = new File(outputDir.get().asFile, 'assets/guildinvitefix/lss')
		outLssDir.mkdirs()

		def tokenFiles = (tokensDir.listFiles({ f -> f.name.endsWith('.tokens') } as FileFilter) ?: []) as List
		if (tokenFiles.isEmpty()) {
			throw new GradleException("generateThemeSheets: no *.tokens files under ${tokensDir}")
		}
		tokenFiles.sort { it.name }

		tokenFiles.each { tokenFile ->
			def tokens = [:]
			tokenFile.eachLine('UTF-8') { line ->
				def trimmed = line.trim()
				if (trimmed.isEmpty() || trimmed.startsWith('#') || trimmed.startsWith('//')) {
					return
				}
				def matcher = trimmed =~ /^([A-Za-z0-9_]+)\s*=\s*(\S+)$/
				if (!matcher.matches()) {
					throw new GradleException("generateThemeSheets: malformed token line in ${tokenFile.name}: '${line}'")
				}
				tokens[matcher[0][1]] = matcher[0][2]
			}

			def expanded = template.replaceAll(/\$([A-Za-z][A-Za-z0-9_]*)/) { full, key ->
				if (!tokens.containsKey(key)) {
					throw new GradleException("generateThemeSheets: undefined token '\$${key}' in ${templateFile.name} for theme '${tokenFile.name}'")
				}
				tokens[key]
			}
			if (expanded.contains('$')) {
				throw new GradleException("generateThemeSheets: unresolved '\$' remains after expanding ${tokenFile.name}")
			}

			def themeId = tokenFile.name.substring(0, tokenFile.name.length() - '.tokens'.length())
			new File(outLssDir, "office-${themeId}.lss").setText(expanded, 'UTF-8')
		}
	}
}

tasks.named('processResources') {
	dependsOn generateThemeSheets
	from generatedThemeSheetsDir
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}
